name: Python CI/CD Pipeline

on:
  push:
    branches: [ tp2 ]
  pull_request:
    branches: [ tp2 ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        ruff check .
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy --install-types --non-interactive .
      continue-on-error: true

    - name: Check code complexity with Radon
      run: |
        radon cc . -a -nb
        radon mi . -nb
      continue-on-error: true

    - name: Run tests with pytest
      run: |
        pytest --cov=. --cov-report=xml --cov-report=term -v

  docker-test:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker compose build

    - name: Start services
      run: docker compose up -d

    - name: Wait for service to be healthy
      run: |
        echo "Waiting for service to be healthy..."
        timeout 60 bash -c 'until docker compose ps | grep -q "healthy"; do sleep 2; done'
        docker compose ps

    - name: Show container logs
      if: always()
      run: docker compose logs

    - name: Stop services
      if: always()
      run: docker compose down -v

  build-and-push-image:
    name: Build and Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: docker-test
    if: github.ref == 'refs/heads/tp2' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/flask-api
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Image published
      run: |
        echo "Image published to ghcr.io/${{ github.repository }}/flask-api"
        echo "Tags: ${{ steps.meta.outputs.tags }}"

  generate-manifests:
    name: Generate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.ref == 'refs/heads/tp2' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Kompose
      run: |
        curl -L https://github.com/kubernetes/kompose/releases/download/v1.38.0/kompose-linux-amd64 -o kompose
        chmod +x kompose
        sudo mv kompose /usr/local/bin/

    - name: Update docker-compose.yml with GHCR image
      run: |
        sed -i "s|build:|# build:|g" docker-compose.yml
        sed -i "s|context: \.|# context: .|g" docker-compose.yml
        sed -i "s|dockerfile: Dockerfile|# dockerfile: Dockerfile|g" docker-compose.yml
        sed -i "/# build:/a\    image: ghcr.io/${{ github.repository }}/flask-api:tp2-${{ github.sha }}" docker-compose.yml
        cat docker-compose.yml

    - name: Generate Kubernetes manifests with Kompose
      run: |
        mkdir -p generated-manifests
        kompose convert -f docker-compose.yml -o generated-manifests/
        ls -la generated-manifests/

    - name: Create deployment package
      run: |
        mkdir -p MichaudMael
        cp generated-manifests/*.yaml MichaudMael/
        cp docker-compose.yml MichaudMael/
        cp README.md MichaudMael/ || true
        
        echo "Contenu du package:"
        ls -la MichaudMael/
        
        zip -r MichaudMaelPython.zip MichaudMael/
        ls -lh MichaudMaelPython.zip

    - name: Upload to FTP
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y lftp

        lftp -c "
          set ftp:ssl-allow yes;
          set ssl:verify-certificate no;
          open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
          cd RenduDevopsKube;
          put MichaudMaelPython.zip;
          bye
        "
        
        echo "Déploiement terminé: MichaudMaelPython.zip uploadé dans RenduDevopsKube/"
