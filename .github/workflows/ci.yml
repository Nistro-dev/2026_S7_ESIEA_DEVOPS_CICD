name: CI/CD Pipeline

on:
  push:
    branches: [ tp2 ]
  pull_request:
    branches: [ tp2 ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        ruff check .
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy --install-types --non-interactive .
      continue-on-error: true

    - name: Check code complexity with Radon
      run: |
        radon cc . -a -nb
        radon mi . -nb
      continue-on-error: true

    - name: Run tests with pytest
      run: |
        pytest --cov=. --cov-report=xml --cov-report=term -v

  docker-test:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker compose build

    - name: Start services
      run: docker compose up -d

    - name: Wait for service to be healthy
      run: |
        echo "Waiting for service to be healthy..."
        timeout 60 bash -c 'until docker compose ps | grep -q "healthy"; do sleep 2; done'
        docker compose ps

    - name: Show container logs
      if: always()
      run: docker compose logs

    - name: Stop services
      if: always()
      run: docker compose down -v

  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    needs: docker-test
    if: github.ref == 'refs/heads/tp2' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create deployment archive
      run: |
        zip -r MichaudMaelPython.zip \
          api.py \
          db.py \
          utils.py \
          requirements.txt \
          Dockerfile \
          docker-compose.yml \
          README.md
        
        echo "Archive créée: MichaudMaelPython.zip"
        ls -lh MichaudMaelPython.zip

    - name: Upload to FTP
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y lftp

        lftp -c "
          set ftp:ssl-allow yes;
          set ssl:verify-certificate no;
          open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
          cd RenduDevopsKube;
          put MichaudMaelPython.zip;
          bye
        "
        
        echo "Déploiement terminé: MichaudMaelPython.zip uploadé dans RenduDevopsKube/"
